# 毎回の push と PR で: Python の試験 (普通に使ったときの動き)、ブローカーの試験、
# TIP の判断の試験。
# Linux ではブローカーの中核を偽の土台で試し、Windows では MSVC で本物の
# yuragi-broker.exe を作って、偽エンジン・偽 TIP と名前付きパイプで動かす。
# C++ の単体試験は Linux と macOS で回し、Windows ではビルドだけする。
# macOS (Apple シリコン) では Linux と同じ試験を回し、入力プログラム (src/mac) をビルドして、
# その打鍵の順序の試験を回す。32 ビットの TIP はリリースのときだけビルドする。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ブローカーのビルドと中核の試験 (CTest)
        run: |
          cmake -S src/broker -B build/broker -DCMAKE_BUILD_TYPE=Release
          cmake --build build/broker -j 4
          ctest --test-dir build/broker --output-on-failure

      - name: TIP の判断と JSON の試験 (CTest)
        run: |
          cmake -S src/tip -B build/tip -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tip -j 4
          ctest --test-dir build/tip --output-on-failure

      # 起動・応答・終了、パイプ、インストーラの脚本の実動作、設定と学習データの読み書き。
      # pwsh はランナーに入っている (tests/test_installer_scripts.py)。
      - name: Python の試験 (インストーラの脚本の実動作を含む。ブローカーのプロセスの試験は Windows で)
        run: |
          python -m unittest discover -v

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ブローカーの中核と TIP の判断の試験 (CTest)
        run: |
          cmake -S src/broker -B build/broker -DCMAKE_BUILD_TYPE=Release
          cmake --build build/broker -j 4
          ctest --test-dir build/broker --output-on-failure
          cmake -S src/tip -B build/tip -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tip -j 4
          ctest --test-dir build/tip --output-on-failure

      - name: Python の試験
        run: |
          python -m unittest discover -v

      # 署名は簡易のもの。入力プログラムは OS が起動するものなので、ここでは動かさない。
      - name: 入力プログラムのビルドと、打鍵の順序の試験
        run: |
          PYTHON="$(command -v python)" src/mac/build.sh
          src/mac/test.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ブローカーのビルド (MSVC, Release)
        shell: pwsh
        run: |
          cmake -S src/broker -B build/broker -A x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build/broker --config Release --target yuragi-broker
          if ($LASTEXITCODE -ne 0) { throw "broker build failed" }

      - name: TIP のビルド (MSVC, Release)
        shell: pwsh
        run: |
          cmake -S src/tip -B build/tip -A x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build/tip --config Release --target yuragi_tip
          if ($LASTEXITCODE -ne 0) { throw "TIP build failed" }

      # インストーラの脚本は、利用者が使う Windows PowerShell 5.1 で動かす。設定ウィンドウの二重起動の試験は Windows だけ。
      - name: ブローカーのプロセスの試験 (名前付きパイプ・1 利用者に 1 つ・自己試験)、インストーラの脚本、設定ウィンドウ
        shell: pwsh
        env:
          YURAGI_BROKER: ${{ github.workspace }}\dist\yuragi-broker.exe
          YURAGI_PWSH: powershell
        run: |
          python -m unittest -v tests.test_broker tests.test_installer_scripts tests.test_admin_ui
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
