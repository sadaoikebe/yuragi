# 毎回の push と PR で: Python の試験 (普通に使ったときの動き)、ブローカーの試験、
# TIP の判断の試験。
# Linux ではブローカーの中核を偽の土台で試し、Windows では MSVC で本物の
# yuragi-broker.exe を作って、偽エンジン・偽 TIP と名前付きパイプで動かす。
# Windows では、torch を入れて、エンジンの標準入力の試験 (DESIGN「エンジン」の注意) も回す。
# リリース (release.yml) も、公開の前にこのワークフローをタグのコミットで呼ぶ。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 辞書は data/dictionary-manifest.json で固定した上流コミットのもの。
      - name: Mozc 辞書 (キャッシュ)
        uses: actions/cache@v4
        with:
          path: third_party/mozc_oss_dict
          key: mozc-dict-${{ hashFiles('data/dictionary-manifest.json') }}

      - name: Mozc 辞書の取得と照合
        run: |
          python -m tools.eval.fetch_mozc_dict
          python -m yuragi.lattice.dict_manifest verify

      - name: ブローカーのビルドと中核の試験 (CTest)
        run: |
          cmake -S src/broker -B build/broker -DCMAKE_BUILD_TYPE=Release
          cmake --build build/broker -j 4
          ctest --test-dir build/broker --output-on-failure

      - name: TIP の判断と JSON の試験 (CTest)
        run: |
          cmake -S src/tip -B build/tip -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tip -j 4
          ctest --test-dir build/tip --output-on-failure

      # 起動・応答・終了、パイプ、インストーラの脚本の実動作、設定と学習データの読み書き。
      # pwsh はランナーに入っている (tests/test_installer_scripts.py)。
      - name: Python の試験 (インストーラの脚本の実動作を含む。ブローカーのプロセスの試験は Windows で)
        run: |
          python -m unittest discover -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Mozc 辞書 (キャッシュ)
        uses: actions/cache@v4
        with:
          path: third_party/mozc_oss_dict
          key: mozc-dict-${{ hashFiles('data/dictionary-manifest.json') }}

      - name: Mozc 辞書の取得と照合
        shell: pwsh
        run: |
          python -m tools.eval.fetch_mozc_dict
          if ($LASTEXITCODE -ne 0) { throw "dictionary fetch failed" }
          python -m yuragi.lattice.dict_manifest verify
          if ($LASTEXITCODE -ne 0) { throw "dictionary does not match the manifest" }

      - name: ブローカーのビルド (MSVC, Release) と中核の試験
        shell: pwsh
        run: |
          cmake -S src/broker -B build/broker -A x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build/broker --config Release
          if ($LASTEXITCODE -ne 0) { throw "broker build failed" }
          ctest --test-dir build/broker -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "broker core test failed" }

      - name: TIP のビルド (MSVC, Release) と判断の試験 (tip_logic, tip_json)
        shell: pwsh
        run: |
          cmake -S src/tip -B build/tip -A x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build/tip --config Release
          if ($LASTEXITCODE -ne 0) { throw "TIP build failed" }
          ctest --test-dir build/tip -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "TIP tests failed" }

      - name: 32 ビットの TIP のビルド (MSVC, Release) と判断の試験
        shell: pwsh
        run: |
          cmake -S src/tip -B build/tip32 -A Win32
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build/tip32 --config Release
          if ($LASTEXITCODE -ne 0) { throw "32-bit TIP build failed" }
          ctest --test-dir build/tip32 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "32-bit TIP tests failed" }

      # tests/test_engine_stdin.py は torch が無いと飛ばされる。利用者の PC と同じく、
      # setup.ps1 の版の CPU 版 torch と packaging/requirements.txt (numpy を含む) を入れる。
      - name: torch と依存 (setup.ps1 と同じ版、CPU 版)
        shell: pwsh
        run: |
          $match = Select-String -Path packaging/setup.ps1 -Pattern '^\$TorchVersion = "([0-9.]+)"'
          if (-not $match) { throw "packaging/setup.ps1: no TorchVersion line" }
          $torch = $match.Matches[0].Groups[1].Value
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==$torch"
          if ($LASTEXITCODE -ne 0) { throw "torch $torch install failed" }
          python -m pip install -r packaging/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements install failed" }
          python -c "import torch, numpy; print('torch', torch.__version__, 'numpy', numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "torch does not import" }

      - name: ブローカーのプロセスの試験 (名前付きパイプ・1 利用者に 1 つ・自己試験) とエンジンの標準入力の試験
        shell: pwsh
        env:
          YURAGI_BROKER: ${{ github.workspace }}\dist\yuragi-broker.exe
        run: |
          python -m unittest -v tests.test_broker tests.test_engine_stdin
          if ($LASTEXITCODE -ne 0) { throw "broker or engine stdin tests failed" }
