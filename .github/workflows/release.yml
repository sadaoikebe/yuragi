# リリース作成 (DESIGN「インストール・更新・アンインストール」): タグ v* を push すると、Windows ランナーで
# TIP (64・32 ビット) とブローカーをタグ入りの Release でビルド・試験し、setup が
# 取得するアセット (DLL 2 つ・ブローカー・ソース zip・tkinter 一式・タグ/ハッシュを刻んだ setup.ps1)
# と、アンインストールの入口 uninstall.ps1 を公開する。公開前の検証が1つでも失敗すればリリースは出ない。
# 公開のあとで、配布先の確認とインストールの試験をする。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 同梱 Python の版の数字は setup.ps1 の 1 か所だけに書く。以降のジョブはここで読んだものを使う。
  pins:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.read.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          python=$(sed -n 's/^\$EmbedPythonVersion = "\([0-9.]*\)".*/\1/p' packaging/setup.ps1)
          test -n "$python" || { echo "packaging/setup.ps1: no EmbedPythonVersion line"; exit 1; }
          echo "python=$python" >> "$GITHUB_OUTPUT"

  build:
    needs: pins
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: TIP とブローカーのビルドと試験 (Release、タグを埋め込む。登録はしない)
        shell: pwsh
        run: ./src/tip/dev-build.ps1 -Tag "${{ github.ref_name }}"

      # setup.ps1 の同梱ランタイムと同じ版 ($EmbedPythonVersion)。埋め込み版に無い tkinter 一式を
      # この通常版から取る。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.pins.outputs.python }}

      - name: モデルの固定リビジョンの存在確認
        shell: pwsh
        run: |
          $lines = @(Select-String -Path packaging/fetch_model.py -Pattern '^MODEL_(\w+) = \("([^"]+)", "([0-9a-f]+)"\)')
          if ($lines.Count -lt 2) { throw "fetch_model.py: expected the MODEL_medium and MODEL_small lines" }
          foreach ($line in $lines) {
            $repo = $line.Matches[0].Groups[2].Value; $rev = $line.Matches[0].Groups[3].Value
            $resp = Invoke-WebRequest -UseBasicParsing "https://huggingface.co/api/models/$repo/revision/$rev"
            if ($resp.StatusCode -ne 200) { throw "model revision not found: $repo@$rev" }
            Write-Host "model revision OK: $repo@$rev"
          }

      - name: アセットの組み立て
        shell: pwsh
        run: |
          git archive --format=zip -o yuragi-source.zip HEAD
          Copy-Item dist/yuragi_tip.dll .
          Copy-Item dist/yuragi_tip32.dll .
          Copy-Item dist/yuragi-broker.exe .
          $pyVersion = "${{ needs.pins.outputs.python }}"
          # 設定ウィンドウ用の tkinter 一式。埋め込み版には無いので、同じ版の通常版
          # (setup-python が入れたもの) から取り、setup.ps1 がランタイムの直下に展開する。
          $base = @(python -c "import sys, platform; print(platform.python_version()); print(platform.architecture()[0]); print(sys.base_prefix)")
          if ($base[0] -ne $pyVersion -or $base[1] -ne "64bit") { throw "setup-python gave $($base[0]) $($base[1]), not $pyVersion 64bit" }
          $tkDir = Join-Path $env:RUNNER_TEMP "tkinter"
          New-Item -ItemType Directory (Join-Path $tkDir "Lib") | Out-Null
          Get-ChildItem (Join-Path $base[2] "DLLs") -File | Where-Object { $_.Name -match '^(_tkinter\.pyd|tcl.*\.dll|tk.*\.dll|zlib.*\.dll)$' } |
            Copy-Item -Destination $tkDir
          Copy-Item (Join-Path $base[2] "tcl") (Join-Path $tkDir "tcl") -Recurse
          Copy-Item (Join-Path $base[2] "Lib\tkinter") (Join-Path $tkDir "Lib\tkinter") -Recurse
          Get-ChildItem $tkDir -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Get-ChildItem $tkDir -File | ForEach-Object { Write-Host "tkinter asset: $($_.Name)" }
          $tkName = "python-$pyVersion-tkinter-amd64.zip"
          Compress-Archive -Path (Join-Path $tkDir "*") -DestinationPath $tkName
          # setup.ps1 にタグと、同梱 Python の公式ハッシュを刻む。
          $embedName = "python-$pyVersion-embed-amd64.zip"
          Invoke-WebRequest -UseBasicParsing "https://www.python.org/ftp/python/$pyVersion/$embedName" -OutFile $embedName
          $embedHash = (Get-FileHash $embedName -Algorithm SHA256).Hash.ToLower()
          $setup = Get-Content packaging/setup.ps1 -Raw
          $setup = $setup -replace "__TAG__", $env:GITHUB_REF_NAME -replace "__EMBED_SHA256__", $embedHash
          # 利用者が実行するのは Windows PowerShell 5.1。BOM が無いと ANSI として読まれる。
          $setup | Set-Content setup.ps1 -Encoding utf8BOM
          # アンインストールの入口 (入っている版を見つけて、その版の本体を呼ぶ)。
          Copy-Item packaging/uninstall-entry.ps1 uninstall.ps1

      - name: スクリプトの構文チェック (刻印後の実物も、利用者と同じ Windows PowerShell 5.1 で)
        shell: powershell
        run: |
          foreach ($f in @("packaging/setup.ps1", "packaging/uninstall.ps1", "packaging/uninstall-entry.ps1", "packaging/elevated.ps1", "setup.ps1", "uninstall.ps1")) {
            $head = [IO.File]::ReadAllBytes((Resolve-Path $f)) | Select-Object -First 3
            if (($head -join ",") -ne "239,187,191") { throw "$f : missing UTF-8 BOM (Windows PowerShell 5.1 would read it as ANSI)" }
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count) { throw "$f : $($errors[0].Message)" }
            Write-Host "parse OK: $f"
          }

      - name: 現在の正式版の配布先を記録
        id: stable
        shell: pwsh
        run: |
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/setup.ps1"
          $destination = curl.exe --silent --show-error --head --max-time 15 --output NUL --write-out '%{redirect_url}' $url
          if ($LASTEXITCODE -ne 0) { throw "Could not check the current installer URL" }
          "destination=$destination" >> $env:GITHUB_OUTPUT

      # 正式公開は、実機確認を終えた所有者が GitHub の Releases 画面で行う。
      - name: リリースへ公開 (プレリリース)
        # 第三者のアクション (contents: write を持つ): タグではなくコミットで固定する。
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          prerelease: true
          make_latest: "false"
          # 名前が実物とずれたアセットがあれば、欠けたまま出さずに止まる。
          fail_on_unmatched_files: true
          body: "インストール・更新・アンインストールは README を参照してください。"
          files: |
            setup.ps1
            uninstall.ps1
            yuragi_tip.dll
            yuragi_tip32.dll
            yuragi-broker.exe
            yuragi-source.zip
            python-${{ needs.pins.outputs.python }}-tkinter-amd64.zip

      - name: プレリリースと正式版の配布先を確認
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_INSTALLER: ${{ steps.stable.outputs.destination }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.prerelease -or $release.draft) {
            throw "Expected a published prerelease for $env:GITHUB_REF_NAME"
          }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/setup.ps1"
          $destination = curl.exe --silent --show-error --head --max-time 15 --output NUL --write-out '%{redirect_url}' $url
          if ($LASTEXITCODE -ne 0 -or "$destination" -cne "$env:STABLE_INSTALLER") {
            throw "The latest installer URL changed while publishing the prerelease"
          }

  # 公開したプレリリースの setup.ps1 で、まっさらなランナーに実際に入れる (経路は 1 本)。
  # 1 つ前の正式版 (releases/latest。あれば) のインストール → この版への更新 (旧版の Program Files と
  # versions が残らないか) → 動作 (ブローカーが ready、同梱ランタイムで tkinter と zenz の変換が動くか)
  # → 同じ版の入れ直し (学習データが残るか)
  # → リリースの uninstall.ps1 でアンインストール (プログラムは全部消え、利用者のデータは残るか)
  # → もう一度 uninstall.ps1 (入っていないと伝えて、何もせずに終わるか)。
  install-test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: install, reinstall, uninstall
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # ASCII only: this step runs in Windows PowerShell 5.1.
          $ErrorActionPreference = "Stop"
          $setup = Join-Path $env:RUNNER_TEMP "yuragi-setup.ps1"
          Invoke-WebRequest -UseBasicParsing "https://github.com/$env:REPO/releases/download/$env:TAG/setup.ps1" -OutFile $setup
          $uninstall = Join-Path $env:RUNNER_TEMP "yuragi-uninstall.ps1"
          Invoke-WebRequest -UseBasicParsing "https://github.com/$env:REPO/releases/download/$env:TAG/uninstall.ps1" -OutFile $uninstall
          $program = Join-Path $env:ProgramFiles "yuragi-ime\$env:TAG"
          $local = Join-Path $env:LOCALAPPDATA "yuragi-ime"
          $userData = Join-Path $env:USERPROFILE ".yuragi-ime"
          $inproc = "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{A7C4E201-0B3A-4F11-9E61-0C1A0B7E0A01}\InprocServer32"
          $inproc32 = "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Classes\CLSID\{A7C4E201-0B3A-4F11-9E61-0C1A0B7E0A01}\InprocServer32"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $startupMarker = "$env:SystemRoot\System32\cmd.exe /c exit 0"

          function Invoke-Logged([string]$label, [string[]]$argv) {
            Write-Host "::group::$label"
            $ErrorActionPreference = "Continue"
            $out = & powershell @argv 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
            $ErrorActionPreference = "Stop"
            $out | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            if ($code -ne 0) { throw "$label failed with exit code $code" }
          }
          function Get-BrokerState {
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $session = (Get-Process -Id $PID).SessionId
            $pipe = New-Object System.IO.Pipes.NamedPipeClientStream(".", "yuragi-ime-$sid-$session", [IO.Pipes.PipeDirection]::InOut)
            $pipe.Connect(5000)
            $writer = New-Object IO.StreamWriter($pipe); $writer.AutoFlush = $true; $writer.NewLine = "`n"
            $reader = New-Object IO.StreamReader($pipe)
            $writer.WriteLine('{"op":"hello","proto":1}')
            $state = ($reader.ReadLine() | ConvertFrom-Json).state
            $pipe.Dispose()
            return $state
          }
          function Assert-Installed {
            foreach ($f in @("yuragi_tip.dll", "yuragi_tip32.dll", "yuragi-broker.exe", "elevated.ps1")) {
              if (-not (Test-Path (Join-Path $program $f))) { throw "missing $f in Program Files" }
            }
            if ((Get-ItemProperty $inproc).'(default)' -ne (Join-Path $program "yuragi_tip.dll")) { throw "TIP is not registered to Program Files" }
            if ((Get-ItemProperty $inproc32).'(default)' -ne (Join-Path $program "yuragi_tip32.dll")) { throw "32-bit TIP is not registered to Program Files" }
            if ((Get-ItemProperty "HKCU:\Software\yuragi-ime").Tag -ne $env:TAG) { throw "HKCU Tag is not $env:TAG" }
            $startup = Get-ItemProperty -LiteralPath $runKey
            if (-not $startup."yuragi-ime") { throw "no yuragi-ime Run entry" }
            if ($startup."yuragi-ci-startup" -cne $startupMarker) { throw "existing Run entry changed during setup" }
            if (-not (Test-Path (Join-Path $local "versions\$env:TAG\engine.json"))) { throw "no engine.json" }
            $state = Get-BrokerState
            if ($state -ne "ready") { throw "broker state is $state, not ready" }
          }

          if (-not (Test-Path -LiteralPath $runKey)) { New-Item -Path $runKey | Out-Null }
          Set-ItemProperty -LiteralPath $runKey -Name "yuragi-ci-startup" -Value $startupMarker
          # The update path: the latest release first (when there is one other than this tag).
          $latestUrl = "https://github.com/$env:REPO/releases/latest/download/setup.ps1"
          $latestAt = curl.exe --silent --show-error --head --max-time 15 --output NUL --write-out '%{redirect_url}' $latestUrl
          if ($LASTEXITCODE -ne 0) { throw "Could not look up the latest release" }
          $latestTag = ""
          if ("$latestAt" -match '/releases/download/([^/]+)/setup\.ps1$' -and $Matches[1] -ne $env:TAG) { $latestTag = $Matches[1] }
          if ($latestTag) {
            $latestSetup = Join-Path $env:RUNNER_TEMP "yuragi-latest-setup.ps1"
            Invoke-WebRequest -UseBasicParsing $latestAt -OutFile $latestSetup
            Invoke-Logged "install $latestTag (the latest release)" @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $latestSetup, "-Yes")
            if ((Get-ItemProperty "HKCU:\Software\yuragi-ime").Tag -ne $latestTag) { throw "HKCU Tag is not $latestTag" }
          } else {
            Write-Host "No latest release other than $($env:TAG); a fresh install only"
          }

          $setupArgs = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $setup, "-Yes")
          Invoke-Logged "install (over $latestTag)" $setupArgs
          Assert-Installed
          if ($latestTag) {
            # Its broker was asked to quit before the old version was removed: nothing of it stays.
            if (Test-Path (Join-Path $env:ProgramFiles "yuragi-ime\$latestTag")) { throw "Program Files still has $latestTag after the update" }
            if (Test-Path (Join-Path $local "versions\$latestTag")) { throw "versions\$latestTag remains after the update" }
          }
          Write-Host "install OK"

          # The settings window (admin_args in engine.json) needs tkinter in the bundled runtime.
          $engine = Get-Content (Join-Path $local "versions\$env:TAG\engine.json") -Raw | ConvertFrom-Json
          & $engine.python -c "import tkinter; r = tkinter.Tk(); r.withdraw(); print('tkinter OK: Tk', r.tk.call('info', 'patchlevel')); r.destroy()"
          if ($LASTEXITCODE -ne 0) { throw "tkinter does not load in the bundled runtime ($($engine.python))" }

          # Exercise the installed runtime, dictionary and model with LM required.
          # A runner has no GPU: the CPU model (small) only.
          if ("--lm-cpu-model" -notin $engine.args) { throw "installed engine.json does not specify its CPU model" }
          $lmTest = Join-Path $env:RUNNER_TEMP "yuragi-lm-selftest"
          New-Item -ItemType Directory -Path $lmTest | Out-Null
          $lmEngine = Join-Path $lmTest "engine.json"
          $engine.args = @($engine.args) + @("--require-lm", "--data-dir", $lmTest)
          [IO.File]::WriteAllText($lmEngine, ($engine | ConvertTo-Json -Depth 4), [Text.UTF8Encoding]::new($false))
          $lmOutput = Join-Path $lmTest "selftest.txt"
          $lmProcess = Start-Process -FilePath (Join-Path $program "yuragi-broker.exe") `
              -ArgumentList @("--selftest", "`"$lmEngine`"", "--data-dir", "`"$lmTest`"") `
              -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $lmOutput
          Get-Content -LiteralPath $lmOutput
          # The calibration (which model this machine gets, and its time) for the record.
          $engineLog = Join-Path $lmTest "logs\engine.log"
          if (Test-Path -LiteralPath $engineLog) { Get-Content -LiteralPath $engineLog | Select-String "LM " }
          if ($lmProcess.ExitCode -ne 0) {
            $lmLog = Join-Path $lmTest "logs\broker.log"
            if (Test-Path -LiteralPath $lmLog) { Get-Content -LiteralPath $lmLog }
            throw "installed zenz selftest failed with exit code $($lmProcess.ExitCode)"
          }

          $learning = Join-Path $userData "learning.jsonl"
          $marker = '{"ci":"learning survives a reinstall"}'
          Set-Content $learning $marker -Encoding ASCII
          Invoke-Logged "reinstall (same tag)" $setupArgs
          Assert-Installed
          if ((Get-Content $learning -Raw).Trim() -ne $marker) { throw "learning data changed during the reinstall" }
          Write-Host "reinstall OK (learning data kept)"

          $uninstallArgs = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $uninstall, "-Yes")
          Invoke-Logged "uninstall" $uninstallArgs
          if (Test-Path $inproc) { throw "TIP registration remains after uninstall" }
          if (Test-Path $inproc32) { throw "32-bit TIP registration remains after uninstall" }
          if (Test-Path $local) { throw "$local remains after uninstall" }
          if (Test-Path (Join-Path $env:ProgramFiles "yuragi-ime")) { throw "Program Files\yuragi-ime remains (nothing had the DLL loaded)" }
          if ((Get-ItemProperty "HKCU:\Software\yuragi-ime" -ErrorAction SilentlyContinue).Tag) { throw "HKCU Tag remains" }
          if (Get-Process -Name "yuragi-broker" -ErrorAction SilentlyContinue) { throw "a broker is still running" }
          if (-not (Test-Path $learning)) { throw "uninstall removed the learning history (user data must stay)" }
          Write-Host "uninstall OK (user data kept)"

          Invoke-Logged "uninstall again (nothing installed)" $uninstallArgs
          if (-not (Test-Path $learning)) { throw "the second uninstall removed the learning history" }
          Write-Host "uninstall again OK (nothing to do)"
